<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orbit-doodle</title>
<!-- Description is the README's opening sentence, verbatim: one claim, said
     once, in the two places a stranger meets the project. -->
<meta name="description" content="A drawing toy where the pen orbits your cursor — you steer the center, physics draws the flourishes.">
<meta name="theme-color" content="#111111">
<meta property="og:type" content="website">

<meta property="og:description" content="A drawing toy where the pen orbits your cursor — you steer the center, physics draws the flourishes.">
<meta property="og:url" content="https://yinggarykairui.github.io/orbit-doodle/">
<meta property="og:image" content="https://yinggarykairui.github.io/orbit-doodle/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<!-- The favicon is the drawing in miniature — an orbit with the pen on it — as
     an inline SVG data URI. A .ico or .svg file would be a second file and a
     second request; without one the browser 404s on /favicon.ico. Loading this
     page is still exactly one request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f5efe6' stroke-width='2'/%3E%3Ccircle cx='25' cy='16' r='3.5' fill='%23ffc94d'/%3E%3C/svg%3E">
<style>
  /* Layout: canvas fills everything above a fixed-height controls bar.
     No page scroll ever — the canvas owns the viewport. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: #111;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: relative; /* anchor for the hint overlay */
    flex: 1;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none; /* touch drags must draw, not scroll */
    cursor: crosshair;
  }
  /* Hint lives in the DOM (not the canvas) so it never shows up in exports. */
  #hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245, 239, 230, 0.55);
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 0 1rem;
    pointer-events: none; /* never intercept the drawing pointer */
    transition: opacity 0.6s ease;
  }
  #hint.hidden { opacity: 0; }
  /* Controls: pinned to the bottom edge. Every target >= 40px, and the row
     wraps at narrow widths (e.g. 375px) so nothing clips or truncates.
     The bar holds four groups — colours, pens, history, actions. The wide
     column gap is what separates them: with one uniform gap, twelve identical
     targets read as one undifferentiated row, and `drift` sitting next to
     `Clear` reads as another action. */
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 22px;
    padding: 8px;
    background: #1b1b1b;
    border-top: 1px solid #2a2a2a;
  }
  /* A group is the unit that wraps: its members never split across two rows. */
  #controls .group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  /* A control is a target for a finger, not a paragraph: a long-press-drag that
     starts on a pen label used to raise the selection callout instead of doing
     nothing, and double-tapping the arrows used to zoom. */
  #controls button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex: none;
  }
  .swatch.active {
    border-color: #f5efe6;
    box-shadow: 0 0 0 2px #111 inset;
  }
  #controls button.action {
    min-height: 40px;
    min-width: 40px;
    padding: 0 14px;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    background: #242424;
    color: #e6ded2;
    /* One type size across the bar. Clear and Save PNG used to be the largest,
       loudest things on screen, which put the destructive action at the top of
       a hierarchy it has no business leading. */
    font-size: 0.85rem;
    cursor: pointer;
    flex: none;
  }
  #controls button.action:active { background: #333; }
  /* Disabled must read as disabled but stay legible: at 0.35 the two history
     arrows sat at 2.96:1 against the bar on first load, which made the
     headline affordance the faintest thing a first-time visitor sees. At 0.5
     an arrow samples rgb(129,125,119) on the rgb(31,31,31) the button fades
     to, which is 4.03:1 — clear of the 3:1 floor for a non-text control, and
     a third of the 11.64:1 an enabled arrow measures, so the two states stay
     obviously different. Both figures sampled from a 1440x900 render. */
  #controls button.action:disabled {
    opacity: 0.5;
    cursor: default;
  }
  /* Pens: same active ring as the swatches, so the two pickers read alike. */
  #controls button.pen {
    padding: 0 10px;
    letter-spacing: 0.02em;
  }
  #controls button.pen.active {
    border-color: #f5efe6;
    background: #333;
  }
  /* History arrows: square, glyph-only, same 40px target as everything else. */
  #controls button.history {
    padding: 0;
    font-size: 1.35rem;
    line-height: 1;
  }
  /* Hover. The bar had no :hover rule at all — twelve targets and not one of
     them moved a pixel under the pointer, so nothing in it looked pressable.
     One step up the same greys the bar is already built from; a swatch gets a
     faint ring, but only while it is not the chosen one, so hover can never
     dim the selection it is sitting on. Gated on (hover: hover) so a touch
     device does not leave a control stuck in the hovered state after a tap. */
  @media (hover: hover) {
    #controls button.action:hover:not(:disabled) {
      background: #2f2f2f;
      border-color: #4f4f4f;
    }
    #controls button.pen.active:hover { background: #3d3d3d; }
    .swatch:not(.active):hover { border-color: rgba(245, 239, 230, 0.5); }
    /* The chosen swatch cannot take a brighter ring than it already has, so it
       answers the pointer with a halo outside itself instead — and a halo has
       to be soft to read as one. The first attempt had no blur, so 3px of 30%
       warm-white over the #1b1b1b bar resolved to a flat rgb(92,90,87) band
       butted straight against the warm-white selection ring: a second, dirtier
       ring, which looked like a smudge on the chosen colour rather than
       feedback. Blurred, it falls off from the ring instead of stacking
       another edge on it, which is the same move the inactive swatch makes —
       light gathering on the thing under the pointer. */
    .swatch.active:hover {
      box-shadow: 0 0 0 2px #111 inset, 0 0 8px 2px rgba(245, 239, 230, 0.32);
    }
  }
  /* Focus is not selection. Selected is a tight warm-white ring; focus is an
     offset sky-blue outline (the palette's own #6bb8ff, 6.4:1 on the bar), so
     a tabbed-to swatch no longer looks like the chosen one and both states can
     be read at once when they land on the same button. */
  #controls button:focus-visible {
    outline: 2px solid #6bb8ff;
    outline-offset: 3px;
  }
</style>
</head>
<body>
<div id="stage">
  <!-- A bare <canvas> is a hole in the accessibility tree: no name, no role, no
       fallback content, so nothing told a screen-reader user that the page had
       drawn anything at all. `role="img"` is what the element is to a reader —
       a picture — and the name is rewritten by updateChrome() from the same
       state the buttons and the hint are drawn from, so it can never claim a
       flourish that has been dismissed. The hint is the description: it is
       already the sentence that says what to do here. -->
  <canvas id="canvas" role="img" aria-label="drawing canvas — empty" aria-describedby="hint"></canvas>
  <div id="hint">press and drag — the pen orbits you</div>
</div>
<div id="controls">
  <!-- Four groups, so a wrap never splits a picker in half and never leaves a
       pen name sitting beside Clear. Swatches and pens are injected by JS from
       PALETTE/PENS, so that data lives in one place. -->
  <div class="group" id="swatches" role="group" aria-label="colour"></div>
  <div class="group" id="pens" role="group" aria-label="pen"></div>
  <div class="group" role="group" aria-label="history">
    <button class="action history" id="undo" type="button" aria-label="undo">&#8630;</button>
    <button class="action history" id="redo" type="button" aria-label="redo">&#8631;</button>
  </div>
  <div class="group">
    <button class="action" id="clear" type="button">Clear</button>
    <button class="action" id="save" type="button" aria-live="polite">Save PNG</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  var BG = '#111';
  // Colour data in one place: the hex the pen draws with and the name the
  // swatch answers to. "color 3" tells a screen-reader user nothing about
  // which of five identical circles they are on.
  var PALETTE = [
    { hex: '#f5efe6', name: 'warm white' },
    { hex: '#ff6b6b', name: 'coral' },
    { hex: '#ffc94d', name: 'gold' },
    { hex: '#6be5b0', name: 'mint' },
    { hex: '#6bb8ff', name: 'sky blue' }
  ];

  // A pen is nothing but a parameter set for the orbit physics below:
  //   chase     center lerp factor per 60fps frame — low is laggier
  //   angVel    pen angle advance, rad per 60fps frame
  //   radius    orbit radius, px — the loop the pen draws is twice this across
  //   wMin/wMax stroke taper clamp, px
  //   speedBase pen speed (px per 60fps frame) where the taper starts thinning;
  //             roughly angVel * radius, the speed the orbit produces on its own
  //   taper     px of width lost per px/frame of speed above speedBase
  // `orbit` is day 004's pen, constants unchanged. `coil` is a tight fast
  // spring; `drift` swings wide and lags, for long lazy loops.
  var PENS = {
    orbit: { chase: 0.12, angVel: 0.22, radius: 40, wMin: 1,   wMax: 6,  speedBase: 8.0, taper: 0.18 },
    coil:  { chase: 0.20, angVel: 0.55, radius: 14, wMin: 0.8, wMax: 3,  speedBase: 7.7, taper: 0.08 },
    drift: { chase: 0.05, angVel: 0.09, radius: 95, wMin: 3,   wMax: 11, speedBase: 8.6, taper: 0.28 }
  };
  var PEN_ORDER = ['orbit', 'coil', 'drift'];

  // The pen constants above are sized for a desktop window. On a phone they are
  // not: `drift`'s 95px radius is a 190px loop on a 375px canvas, so a stroke
  // drawn within 95px of an edge gets its loop amputated with no signal that
  // anything was lost. Two limits stop that, and a pen is drawn with whichever
  // of them bites harder.
  //
  // 1. A scale below a reference edge of 640px. It measures the *canvas*
  //    (viewW/viewH, set by sizeCanvas), not the viewport: the control bar is
  //    not drawing surface, and counting it made a landscape phone look
  //    roomier than it is. At or above 640px the factor is exactly 1 and the
  //    pens are the constants above, unchanged — which is what keeps `orbit`
  //    drawing what day 004 drew. A 1440x900 window is a 1440x843 canvas and
  //    measures 1.000, as do 1440x700 (643) and a tablet in portrait; below
  //    that it is continuous rather than a phone-only special case, so a short
  //    desktop window draws a slightly smaller orbit. A 375x667 phone is a
  //    375x510 canvas and measures 0.586.
  //
  // 2. A cap of a twelfth of the canvas's short edge, so no pen's loop is ever
  //    wider than a sixth of it. The scale alone only shrank the problem: it
  //    still left `drift` a 55.7px radius on that 375x510 canvas, and a stroke
  //    drawn 25px from the top still lost 38% of its ink against the same
  //    stroke drawn at centre. The cap takes that to 20%. It binds on the
  //    desktop too — `drift` is 70.2px rather than 95px at 1440x900 — and that
  //    is deliberate: a 190px loop clips against a desktop edge as well, just
  //    less often. It never binds on `orbit` or `coil` at or above the
  //    reference edge, so both still render the day-004 line exactly (measured:
  //    0-pixel diff at 1440x900, 1440x700 and 1024x768).
  //
  // speedBase scales with the radius because it *is* roughly angVel * radius,
  // the speed the orbit produces on its own; taper scales inversely so the
  // width curve stays the same shape over the compressed speed range. Scaling
  // radius alone would flatten the taper into a constant-width line.
  var REF_EDGE = 640;
  var MAX_RADIUS_FRACTION = 1 / 12;
  var penScale = 1;
  var maxRadius = Infinity;

  function updatePenScale() {
    var shortEdge = Math.min(viewW, viewH);
    penScale = Math.min(1, shortEdge / REF_EDGE);
    maxRadius = shortEdge * MAX_RADIUS_FRACTION;
  }

  // The effective scale is whichever of the two limits bites harder, and every
  // constant that depends on radius moves with it, so a scaled pen is the same
  // pen drawn smaller rather than a different one. k === 1 returns the constants
  // object itself: that is the day-004 pen, byte for byte.
  function scaledPen(pen) {
    var radius = Math.min(pen.radius * penScale, maxRadius);
    var k = radius / pen.radius;
    if (k === 1) return pen;
    return {
      chase: pen.chase,
      angVel: pen.angVel,
      radius: radius,
      wMin: pen.wMin,
      wMax: pen.wMax,
      speedBase: pen.speedBase * k,
      taper: pen.taper / k
    };
  }

  var stage = document.getElementById('stage');
  var controls = document.getElementById('controls');
  var canvas = document.getElementById('canvas');
  var hint = document.getElementById('hint');
  var swatchGroup = document.getElementById('swatches');
  var penGroup = document.getElementById('pens');
  var undoBtn = document.getElementById('undo');
  var redoBtn = document.getElementById('redo');
  var clearBtn = document.getElementById('clear');
  var saveBtn = document.getElementById('save');
  // Captured here, not next to ackSave(): updateChrome() restores this label
  // whenever Save goes disabled, and updateChrome() runs from the first
  // redraw().
  var SAVE_LABEL = saveBtn.textContent;
  saveBtn.setAttribute('aria-label', SAVE_LABEL);
  var ctx = canvas.getContext('2d');

  var strokeColor = PALETTE[0].hex;
  var penId = 'orbit';        // the pen the next stroke will use
  var livePen = PENS[penId];  // the pen the stroke in progress is using (scaled)

  // The CSS-pixel size the backing store was last built for. redraw() fills
  // this, not stage.clientWidth/Height: between a resize event and the end of
  // its debounce the element has already changed size while the backing store
  // has not, and filling the new size would leave a strip of the old frame
  // along an edge.
  var viewW = 0, viewH = 0;
  // The dpr the backing store was last built for. Anything that needs a buffer
  // at the same resolution (the flourish's compositing layer) reads it here
  // rather than re-asking the window, so the two can never disagree.
  var backingScale = 1;

  // Size the backing store for devicePixelRatio; keep ctx in CSS-pixel units.
  // dpr is capped at 2: past that the backing store grows quadratically for
  // no visible gain. Sizing a canvas wipes it, so callers follow with redraw().
  function sizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    backingScale = dpr;
    viewW = stage.clientWidth;
    viewH = stage.clientHeight;
    updatePenScale();
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // --- History: the source of truth ----------------------------------------
  // The canvas is a *view*. What the drawing actually is lives here, as a list
  // of entries. An entry is either a stroke, holding the pen path the physics
  // emitted, or a clear marker:
  //
  //   { kind: 'stroke', pen: 'orbit', color: '#f5efe6', pts: [x, y, w, ...] }
  //   { kind: 'clear' }
  //
  // Recording the emitted path (rather than the raw pointer input) makes
  // replay exact — re-simulating would depend on frame timing, so undo, redo
  // and resize would each redraw a slightly different picture. Cost is ~24
  // bytes per sample, a few KB per stroke; a full-canvas bitmap snapshot at
  // dpr 2 would be ~10 MB apiece, which is why history holds no bitmaps.
  //
  // `cursor` is how many entries are currently applied. Everything from
  // `cursor` to the end of the list is redoable; drawing again throws it away.
  // Nothing is ever dropped from the front: a stroke is a few KB, so a long
  // session costs single-digit MB, and evicting old entries would silently
  // delete artwork the user can still see.
  var history = [];
  var cursor = 0;
  // The stroke being drawn right now. Live drawing still paints
  // segment-by-segment for latency; this is committed to history on pen-up.
  var pending = null;

  // The ONLY code path that bulk-paints the canvas. Background first (it is
  // painted onto the canvas itself so PNG exports are WYSIWYG), then replay.
  function redraw() {
    ctx.fillStyle = BG;
    // Fill in device pixels, not CSS pixels. The backing store is
    // Math.round(view * dpr), so at a fractional dpr it is up to half a device
    // pixel wider or taller than viewW/viewH cover: at dpr 1.5 on a 375px-wide
    // phone the store is 563px and the CSS-unit fill reached 562.5, leaving the
    // last column half-transparent in the exported PNG (measured RGBA
    // 16,16,16,128 at x=562). Painting the store itself cannot miss an edge.
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    for (var i = visibleFrom(); i < cursor; i++) replayStroke(history[i]);
    if (pending) replayStroke(pending);
    // Painted after the history it is standing in for, and outside it: the
    // flourish is a view-only overlay, so it is repainted here and recorded
    // nowhere. It no-ops once anything has been drawn or it has been dismissed.
    paintGhostSoFar();
    updateChrome();
  }

  // Where replay starts: everything before the most recent applied clear
  // marker is hidden by it. The entries are still there, which is what makes
  // Clear a single undoable step rather than a demolition.
  function visibleFrom() {
    for (var i = cursor - 1; i >= 0; i--) {
      if (history[i].kind === 'clear') return i + 1;
    }
    return 0;
  }

  // Appending discards the redo tail: history is linear, not a tree.
  function pushEntry(entry) {
    history.length = cursor;
    history.push(entry);
    cursor++;
  }

  // The rule for history actions during a live stroke: **a history action ends
  // the gesture first.** The live stroke is committed as an ordinary entry, the
  // rest of the drag draws nothing, and only then does the action apply. So
  // Clear mid-stroke clears everything including the live stroke and stays one
  // undo step; undo mid-stroke takes back the stroke being drawn and leaves it
  // redoable. Without this, `pushEntry` on pen-up would truncate against a
  // cursor the action had already moved, silently destroying entries.
  function endStroke() {
    drawing = false;
    settling = false;
    if (!pending) return;
    // A stroke that never drew a segment (a click too fast for the physics)
    // must not leave a ghost entry.
    if (pending.pts.length >= 6) pushEntry(pending);
    pending = null;
  }

  // Both doors — the buttons and the keyboard shortcuts — land here, and both
  // start by asking whether there is anything to do. Ctrl+Z on an empty history
  // is a no-op, and a no-op is not input: it used to dismiss the opening
  // flourish anyway, which meant a keystroke that changed nothing on the canvas
  // wiped the one thing that was on it. A stroke in progress counts as
  // something to do, because either action ends it.
  function undo() {
    if (cursor === 0 && !pending) return;
    dismissGhost(); endStroke(); if (cursor > 0) cursor--; redraw();
  }
  function redo() {
    if (cursor === history.length && !pending) return;
    dismissGhost(); endStroke(); if (cursor < history.length) cursor++; redraw();
  }

  // Does any of this stroke land on the canvas as it is sized right now?
  // Counting history entries is not the same question: replay preserves art a
  // narrowed window pushed off the edge (widening brings it back), so a canvas
  // can be visibly empty with entries applied. Chrome that counts entries then
  // insists there is something there. Testing the samples rather than the
  // segments between them is enough: samples are single-digit px apart at
  // worst, so no segment steps over a whole canvas.
  function onCanvas(x, y, w) {
    var r = w / 2;
    return x + r >= 0 && x - r <= viewW && y + r >= 0 && y - r <= viewH;
  }

  function strokeVisible(s) {
    var p = s.pts;
    if (!p || p.length < 6) return false;
    for (var i = 0; i < p.length; i += 3) {
      if (onCanvas(p[i], p[i + 1], p[i + 2])) return true;
    }
    return false;
  }

  // Is anything visibly drawn right now? Drives the hint overlay and which of
  // the four buttons are live.
  function hasInk() {
    if (pending && strokeVisible(pending)) return true;
    for (var i = visibleFrom(); i < cursor; i++) {
      if (strokeVisible(history[i])) return true;
    }
    return false;
  }

  // Strokes exist, but not one of them would land on a canvas this size. No
  // history button can help — only a wider window — so neither hint about ↶/↷
  // would be true.
  //
  // It asks that question of the *applied, un-cleared* entries only —
  // `visibleFrom() … cursor`, the same span `redraw()` paints and `hasInk()`
  // tests. Walking the whole list instead counted strokes the canvas is not
  // even trying to show: undone ones, and ones behind an applied clear marker.
  // Those made the window the culprit for an emptiness Redo or Undo owned, and
  // this branch is tested first, so it won. Measured at 1440x900: draw near the
  // right edge, Clear, narrow to 500 px and the hint read "off-canvas — widen
  // the window"; widening back to 1440 left the canvas at 0 inked pixels and
  // flipped the hint to "cleared". Undo in place of Clear was worse — the hint
  // pointed at a window resize while ↶ was disabled and ↷, the button that
  // actually brings the stroke back, sat enabled beside it.
  function allInkOffCanvas() {
    var strokes = 0;
    for (var i = visibleFrom(); i < cursor; i++) {
      if (history[i].kind !== 'stroke') continue;
      strokes++;
      if (strokeVisible(history[i])) return false;
    }
    if (liveInk()) {
      strokes++;
      if (strokeVisible(pending)) return false;
    }
    return strokes > 0;
  }

  // A live stroke counts as drawn the moment it has a segment: it is what the
  // user sees, so the chrome must describe it too.
  function liveInk() {
    return !!(pending && pending.pts.length >= 6);
  }

  var HINT_START = 'press and drag — the pen orbits you';
  // An empty canvas that is one press away from a drawing is not the same as
  // a never-drawn one: saying "press and drag" there implies the work is gone
  // for good. There are two such states and they are recovered by opposite
  // buttons, so they get one message each rather than one message that is
  // wrong half the time.
  var HINT_UNDONE = 'undone — press ↷ to bring it back';
  var HINT_CLEARED = 'cleared — press ↶ to bring it back';
  // A narrowed window can push the whole drawing past the edge. Nothing is
  // lost — replay puts it back when the canvas is big enough again — but
  // saying "cleared" or "press and drag" there would both be false.
  //
  // Two ways to say it, because the remedy is not the same on both devices and
  // naming one the device does not have is worse than naming none. A window is
  // something you widen; a phone has no window to widen, and the state is
  // squarely reachable there — draw near the right edge in landscape, turn the
  // phone upright, and the ink is off the 375px canvas the same drawing had
  // 667px of. Rotating back is the move that device actually offers, and it
  // works in both directions, since portrait is the taller canvas.
  //
  // The test is what the browser reports about the pointer, not a width
  // breakpoint: a 500px-wide desktop window is narrow and still widens, and a
  // tablet is roomy and still only rotates. It is read at hint time rather than
  // cached, so a device that changes its answer gets the right sentence.
  var HINT_OFFCANVAS = 'off-canvas — widen the window';
  var HINT_OFFCANVAS_TOUCH = 'off-canvas — rotate to bring it back';
  var touchOnly = window.matchMedia('(hover: none) and (pointer: coarse)');
  var hintVisible = true;
  // Buttons and hint always describe the real state — including on first load,
  // where both arrows start disabled, and mid-stroke, where the stroke in
  // progress is already undoable and has already doomed the redo tail.
  // Undo and redo answer "is there an entry either side of the cursor"; Clear
  // and Save answer "is there ink on the canvas", because that is what they
  // act on: an enabled Clear with nothing to clear is a silent no-op, and an
  // enabled Save PNG with nothing to save exports a blank rectangle.
  // All four action buttons can disable themselves: the last undo, the last
  // redo, Clear and Save PNG on the ink they just removed. A disabled control
  // cannot hold focus, so the browser drops it to <body> and the next Tab
  // starts the bar over at the first swatch — the keyboard user is thrown back
  // to the beginning for having used a button. So focus is handed on before the
  // button goes: forward through the bar first, so Tab carries on in the
  // direction it was already going, and backward only when nothing live is
  // left ahead. The pickers are never disabled, so there is always a target.
  //
  // updateChrome disables in DOM order, so a forward hop can land on a button
  // this same pass is about to disable — that button then hands focus on again
  // by the same rule, which is why this is written as a hop rather than a
  // lookahead.
  function setDisabled(btn, off) {
    if (off && !btn.disabled && document.activeElement === btn) {
      var all = controls.querySelectorAll('button');
      var at = Array.prototype.indexOf.call(all, btn);
      var next = null;
      for (var i = at + 1; i < all.length && !next; i++) if (!all[i].disabled) next = all[i];
      for (var j = at - 1; j >= 0 && !next; j--) if (!all[j].disabled) next = all[j];
      if (next) next.focus();
    }
    btn.disabled = off;
  }

  function updateChrome() {
    var live = liveInk();
    var ink = hasInk();
    setDisabled(undoBtn, cursor === 0 && !live);
    setDisabled(redoBtn, live || cursor === history.length);
    setDisabled(clearBtn, !ink);
    setDisabled(saveBtn, !ink);
    // A dim Save must not still read "Saved ✓". Clear or Ctrl+Z inside the
    // 1.6 s acknowledgement window empties the canvas the export came from, so
    // the ack is advertising a completed action on a control that can no
    // longer offer one; it goes the moment the button does, not when its timer
    // happens to expire.
    if (!ink) clearSaveAck();
    var show = !ink;
    // Empty with entries applied usually means the newest applied entry is a
    // clear marker (that is what makes the canvas look empty), so Undo is the
    // way back. Empty with nothing applied and a redo tail waiting is the
    // undone-to-empty case, and Redo is the way back. Neither is true if the
    // art the canvas is *currently applying* is simply outside this window, so
    // that case is tested first — and it only ever answers for that same span,
    // or it would pre-empt the two states it is meant to defer to.
    var text = HINT_START;
    if (show) {
      if (allInkOffCanvas()) text = touchOnly.matches ? HINT_OFFCANVAS_TOUCH : HINT_OFFCANVAS;
      else if (cursor > 0) text = HINT_CLEARED;
      else if (history.length > 0) text = HINT_UNDONE;
    }
    if (hint.textContent !== text) hint.textContent = text;
    if (show !== hintVisible) {
      hintVisible = show;
      hint.classList.toggle('hidden', !show);
    }
    nameCanvas();
  }

  // What the canvas is called in the accessibility tree. It is a description of
  // what is on it, not a label for a widget, and it has to stay true as the
  // state moves: the flourish clause is gated on ghostActive(), and every path
  // that dismisses the flourish redraws, so the name loses that clause in the
  // same frame the ink goes. Strokes are counted the way hasInk() counts them —
  // only the ones the canvas is currently showing — so a narrowed window that
  // has pushed the art off the edge reads "empty" here and "off-canvas" in the
  // hint, which is the description, rather than the two contradicting.
  var GHOST_NAME = 'drawing canvas — one faint stroke the toy drew itself, to ' +
                   'show what its pen does; not part of your drawing';
  function nameCanvas() {
    var name;
    if (ghostActive() && ghostShown > 0) {
      name = GHOST_NAME;
    } else {
      var n = 0;
      for (var i = visibleFrom(); i < cursor; i++) {
        if (history[i].kind === 'stroke' && strokeVisible(history[i])) n++;
      }
      if (liveInk() && strokeVisible(pending)) n++;
      name = n === 0 ? 'drawing canvas — empty'
                     : 'drawing canvas — ' + n + (n === 1 ? ' stroke' : ' strokes');
    }
    if (canvas.getAttribute('aria-label') !== name) canvas.setAttribute('aria-label', name);
  }

  function replayStroke(s) {
    var p = s.pts;
    if (!p || p.length < 6) return; // clear markers and single samples draw nothing
    ctx.strokeStyle = s.color;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // One path per segment, exactly as the live loop drew it. Batching runs of
    // equal width would be faster, but a batched polyline composites its
    // overlaps once where the live loop composites them twice, so a replayed
    // stroke would not be pixel-identical to the drawn one — and
    // history-as-paths is only sound while replay is exact.
    //
    // That is a real cost, and it does not stay small. A redraw is every
    // segment since the last clear, so undo scales with how much has been
    // drawn, not with how many undo steps deep you are. Measured at 1440x900
    // with `drift`, one-second drags, median of 5, with the canvas flushed
    // inside the timing: 25s of drawing costs 17.7ms per undo, 50s 39.6ms,
    // 100s 71.7ms, 150s 105.5ms — linear, ~0.70ms per second of pen-down. A
    // resize pays the same replay after its 100ms debounce: 225ms end to end
    // at 150s. So past about a minute and a half of drawing an undo stops
    // being a frame's work. It is not "fast enough" at session scale; it is
    // fast enough for a sitting, and the ceiling is PROJECT.md's history
    // thread, not something to fix by making replay approximate.
    for (var i = 3; i < p.length; i += 3) {
      ctx.lineWidth = p[i + 2];
      ctx.beginPath();
      ctx.moveTo(p[i - 3], p[i - 2]);
      ctx.lineTo(p[i], p[i + 1]);
      ctx.stroke();
    }
  }

  // --- The opening flourish ------------------------------------------------
  // First run only: with history empty and no input received, the page draws
  // one stroke of its own, so a stranger sees what the pen does before touching
  // anything. It is emphatically *not* part of the drawing — not a history
  // entry, not undoable, not ink for hasInk(), never in an exported PNG. That
  // is what makes it safe rather than a second source of truth: on an empty
  // canvas every control that could observe it is already disabled for its own
  // reasons, so nothing here changes what Undo, Redo, Clear or Save PNG mean.
  //
  // It is drawn through the same physics as a real stroke — the scripted
  // pointer path below is fed to the loop from `tick`, one fixed 60fps step per
  // sample — so what it demonstrates is exactly what a drag would do. The path
  // is a pure function of the canvas size, which is what lets a resize rebuild
  // it deterministically instead of stretching a bitmap.
  var GHOST_FRAMES = 144;        // 2.4s of draw-in at 60fps
  var GHOST_ALPHA = 0.42;        // reduced opacity: a demonstration, not your line
  var ghost = null;              // the scripted path + its layout, canvas-sized
  var ghostShown = 0;            // how many of its segments are painted
  var ghostMs = 0;
  var ghostGone = false;         // dismissed, for the life of the page
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // The flourish is one stroke, so it has to composite **once**, at one alpha,
  // the way a real stroke composites once at alpha 1. Painting its 144 segments
  // straight onto the canvas under globalAlpha = 0.42 does not do that: every
  // round cap lands on top of its predecessor, so the alpha stacks as
  // 1-(1-0.42)^n and the line beads. Measured at 1200x800/dpr 2 on the thick
  // left loop, max luminance down the line alternated 112 / 168 on a ~3.5 css-px
  // period — 112 where one segment covered, 168 where two did — while a real
  // stroke sampled the same way is flat. A string of pearls, and the one thing
  // this feature exists to do is show what the toy's line looks like.
  //
  // So the segments are stroked at alpha 1 into an offscreen layer, and the
  // layer is blitted once at GHOST_ALPHA. Overlaps inside the layer resolve at
  // alpha 1 — exactly as they do in a real stroke — and the single blit is the
  // only place transparency happens, so no pixel can be covered twice.
  //
  // The layer is sized to the flourish's bounding box, not to the canvas: at
  // 1440x900/dpr 2 that is 5.4 MB rather than the 9.7 MB a full-canvas buffer
  // would cost, and it is released the moment the flourish is dismissed. It is
  // a compositing buffer for one transient overlay, not a bitmap in the history
  // path — history still holds paths and nothing else.
  var ghostLayer = null;         // <canvas>, bbox-sized, holds the flourish at alpha 1
  var ghostLayerCtx = null;
  var ghostLayerUpto = 0;        // how many segments are in the layer

  function ghostActive() {
    return !ghostGone && history.length === 0 && !pending;
  }

  // The scripted pointer path: a figure eight walked with an ease-out, so the
  // gesture starts fast and coasts to a stop. That is the whole demonstration —
  // fast is where the orbit stretches into long loops, slow is where it coils
  // into knots, and one path shows both.
  //
  // Its amplitudes are measured in orbit radii, not in canvas fractions, and
  // only then clamped to the canvas. The radius is what scaledPen() shrinks on
  // a small screen, so sizing the figure off the canvas alone would leave the
  // loops looking twice as large relative to a phone-sized figure. In radii the
  // composition is the same drawing at every size, and the clamp is what keeps
  // it on screen: the radius term binds at 1440x900, the canvas term binds at
  // 375x667, and the pen path clears every edge by at least 59px down to
  // 320x568 and in landscape.
  var TAU = Math.PI * 2;
  var GHOST_PHASE_EASE = 3;
  // Clear space kept between the flourish and the hint's text box, and between
  // the flourish and the canvas edges.
  var GHOST_HINT_GAP = 14;
  var GHOST_EDGE_GAP = 10;
  // Where on its orbit the pen starts. The pen's drawn speed is the centre's
  // speed plus the orbit's own tangential speed (radius * angVel, 8.80 px per
  // frame for `orbit` at full scale); when the two are equal and opposing, the
  // pen stops dead and reverses, and the ink shows a cusp — a hard notch, half
  // a line width of jog, that reads as a rendering glitch rather than as
  // anything the pen did. The figure decelerates through exactly that speed on
  // the left turn, so it hit one there at every size: pen speed fell to 0.96 px
  // per frame at 1440x900 (0.11 of the orbit's own) and to 0.08 px at 375x667,
  // with a 132-degree turn between two adjacent samples.
  //
  // Nothing about the pen can move — these are `orbit`'s constants. What can
  // move is the phase: `ang` advances by a fixed angVel per frame, so the
  // starting angle chooses which side of its orbit the pen is on when the
  // centre coasts through that speed. Starting the pen on the far side of the
  // orbit puts it broadside there instead of head-on. Swept over the whole
  // circle at seven canvas sizes, the minimum drawn pen speed is worst at 0
  // (0.016 of the orbital speed at phone width) and sits on a broad plateau
  // from about 160 to 225 degrees; pi is in the middle of it and is the one
  // value with a reason. After: minimum pen speed 3.05 px per frame at
  // 1440x900 (0.35), 2.75 px at 375x667 (0.53), sharpest turn between adjacent
  // samples 39-42 degrees rather than 82-132.
  var GHOST_START_ANGLE = Math.PI;

  // The strip of canvas the flourish is allowed to occupy. Both it and the hint
  // used to be centred in #stage, so the figure walked straight through the
  // page's only instruction: at 375x667 it crossed "the pen orbits" head-on —
  // 11.3% of the hint's text box was flourish ink and a glyph over a bead
  // measured 1.07:1, i.e. invisible. A demonstration that hides the sentence
  // telling you how to use the toy is worse than no demonstration.
  //
  // The box is measured, not assumed: a Range over the hint's contents returns
  // the union of its line boxes, so a hint that wraps to two lines at 320px is
  // measured as two lines, and a hint whose text changes is measured again on
  // the next build. The flourish takes the taller of the two strips left over.
  function ghostBand() {
    var top = GHOST_EDGE_GAP;
    var bottom = viewH - GHOST_EDGE_GAP;
    var hb = null;
    var range = document.createRange();
    range.selectNodeContents(hint);
    var b = range.getBoundingClientRect();
    var s = canvas.getBoundingClientRect();
    if (b.width > 0 && b.height > 0) hb = { top: b.top - s.top, bottom: b.bottom - s.top };
    if (!hb) return { top: top, bottom: bottom };
    var above = { top: top, bottom: Math.min(bottom, hb.top - GHOST_HINT_GAP) };
    var below = { top: Math.max(top, hb.bottom + GHOST_HINT_GAP), bottom: bottom };
    return (above.bottom - above.top) >= (below.bottom - below.top) ? above : below;
  }

  // The physics of `tick`, run at exactly one 60fps frame per step (frames === 1,
  // so the lerp is pen.chase itself). Deterministic: same canvas size in, same
  // path out, on load and after any resize.
  function ghostPath(pen, ax, ay) {
    function px_(s) { return viewW / 2 + ax * Math.sin(TAU * s); }
    function py_(s) { return viewH / 2 + ay * Math.sin(2 * TAU * s); }

    var s = 0;
    var cx = px_(0), cy = py_(0);
    var ang = GHOST_START_ANGLE;
    var px = cx + pen.radius * Math.cos(ang), py = cy + pen.radius * Math.sin(ang);
    var w = pen.wMax;
    var pts = [px, py, w];
    var minX = px, maxX = px, minY = py, maxY = py;
    for (var i = 1; i <= GHOST_FRAMES; i++) {
      s = 1 - Math.pow(1 - i / GHOST_FRAMES, GHOST_PHASE_EASE);
      cx += (px_(s) - cx) * pen.chase;
      cy += (py_(s) - cy) * pen.chase;
      ang += pen.angVel;
      var qx = px, qy = py;
      px = cx + pen.radius * Math.cos(ang);
      py = cy + pen.radius * Math.sin(ang);
      var target = pen.wMax - (Math.hypot(px - qx, py - qy) - pen.speedBase) * pen.taper;
      if (target < pen.wMin) target = pen.wMin;
      if (target > pen.wMax) target = pen.wMax;
      w += (target - w) * 0.3;
      pts.push(px, py, w);
      if (px < minX) minX = px; else if (px > maxX) maxX = px;
      if (py < minY) minY = py; else if (py > maxY) maxY = py;
    }
    return { pts: pts, minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  function buildGhost() {
    var pen = scaledPen(PENS.orbit);
    var ax = Math.min(pen.radius * 7.2, viewW * 0.30);
    var ay = Math.min(pen.radius * 2.95, viewH * 0.22);
    var band = ghostBand();
    var avail = band.bottom - band.top;
    var g = ghostPath(pen, ax, ay);
    // The figure is roughly 2*ay tall plus the orbit's own diameter, so taking
    // half the overflow off ay lands within a pixel or two of fitting and the
    // loop converges in one pass at every size tested. The bound is what makes
    // it safe: an ay that reaches 0 leaves a straight run with its loops on it,
    // which is still the pen's line — the orbit radius is never touched,
    // because shrinking that would misrepresent the pen the toy actually draws
    // with.
    for (var n = 0; n < 8 && (g.maxY - g.minY) > avail && ay > 0; n++) {
      ay = Math.max(0, ay - ((g.maxY - g.minY) - avail) / 2 - 0.5);
      g = ghostPath(pen, ax, ay);
    }
    var pts = g.pts;
    var minX = g.minX, maxX = g.maxX, minY = g.minY, maxY = g.maxY;
    // Centre the result, not the script. The orbit centre trails the pointer,
    // so the ink lands a little behind the figure that produced it — 58px left
    // of centre at 1440x900. Translating by the measured offset costs one pass
    // and makes the margins even at every size. Horizontally that is the
    // canvas; vertically it is the band, which is what keeps the hint clear.
    var dx = (viewW - (minX + maxX)) / 2;
    var dy = (band.top + band.bottom - (minY + maxY)) / 2;
    var pad = 0;
    for (var j = 0; j < pts.length; j += 3) {
      pts[j] += dx;
      pts[j + 1] += dy;
      if (pts[j + 2] > pad) pad = pts[j + 2];
    }
    // The bbox the compositing layer is cut to: the path's extent grown by half
    // the widest line (the round caps reach that far past a sample) plus a
    // pixel of slack for antialiasing.
    pad = pad / 2 + 1;
    return {
      pts: pts, w: viewW, h: viewH,
      x0: minX + dx - pad, y0: minY + dy - pad,
      x1: maxX + dx + pad, y1: maxY + dy + pad
    };
  }

  // The layer: one canvas, cut to the flourish's bounding box, at the same
  // resolution as the backing store. Its transform carries the box offset, so
  // the segments below are stroked in the same CSS-pixel coordinates the path
  // is expressed in and the blit is a whole number of device pixels.
  function makeGhostLayer() {
    var ox = Math.floor(ghost.x0 * backingScale);
    var oy = Math.floor(ghost.y0 * backingScale);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(ghost.x1 * backingScale) - ox);
    c.height = Math.max(1, Math.ceil(ghost.y1 * backingScale) - oy);
    var g = c.getContext('2d');
    g.setTransform(backingScale, 0, 0, backingScale, -ox, -oy);
    g.strokeStyle = PALETTE[0].hex;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    ghost.ox = ox;
    ghost.oy = oy;
    ghostLayer = c;
    ghostLayerCtx = g;
    ghostLayerUpto = 0;
  }

  // Segment by segment at alpha 1, exactly as replayStroke paints a real
  // stroke — into the layer, never onto the canvas.
  function paintGhostInto(from, to) {
    var p = ghost.pts;
    var g = ghostLayerCtx;
    for (var i = from; i <= to; i++) {
      var j = i * 3;
      g.lineWidth = p[j + 2];
      g.beginPath();
      g.moveTo(p[j - 3], p[j - 2]);
      g.lineTo(p[j], p[j + 1]);
      g.stroke();
    }
  }

  // The one place the flourish becomes transparent.
  function blitGhost() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = GHOST_ALPHA;
    ctx.drawImage(ghostLayer, ghost.ox, ghost.oy);
    ctx.restore();
  }

  // Called from redraw(), so the flourish survives a resize or a dpr change:
  // the path is rebuilt against the new canvas and repainted to the same point
  // in its draw-in.
  function paintGhostSoFar() {
    if (!ghostActive()) return;
    if (!ghost || ghost.w !== viewW || ghost.h !== viewH) {
      ghost = buildGhost();
      ghostLayer = ghostLayerCtx = null;
    }
    if (ghostShown <= 0) return;
    if (!ghostLayer) makeGhostLayer();
    if (ghostLayerUpto < ghostShown) {
      paintGhostInto(ghostLayerUpto + 1, ghostShown);
      ghostLayerUpto = ghostShown;
    }
    blitGhost();
  }

  // A frame of the draw-in. The flourish is only ever on screen with an empty
  // history and no live stroke (that is what ghostActive() asserts), so the
  // canvas under it is the background and nothing else — repainting that and
  // blitting the layer is a full, correct frame, and it is the only way to add
  // ink to a single-composite overlay without stacking alpha on what is
  // already there.
  function composeGhost() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    paintGhostSoFar();
  }

  // `prefers-reduced-motion` is not a load-time constant — it can flip while
  // the page is open, from an OS accessibility toggle or from devtools.
  // Sampling it once at init left a draw-in running straight through the
  // request: turning `reduce` on 30 frames in, the flourish kept adding ink
  // (2344 -> 3238 -> 3929 inked px over the next 20 frames). Honouring it means
  // *finishing* the flourish at once rather than freezing it half-drawn — a
  // stranger who asked for stillness still sees the whole thing, which is
  // exactly what the load-time branch does.
  function finishGhostForStillness() {
    if (!reduceMotion.matches) return;
    if (!ghostActive() || ghostShown >= GHOST_FRAMES) return;
    ghostShown = GHOST_FRAMES;
    ghostMs = GHOST_FRAMES * FRAME;
    redraw();
  }
  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', finishGhostForStillness);
  else if (reduceMotion.addListener) reduceMotion.addListener(finishGhostForStillness);

  // Input of any kind dismisses it: the first pointerdown on the canvas, or any
  // use of any control. A first-run state, not a mode — it never returns.
  function dismissGhost() {
    if (ghostGone) return false;
    ghostGone = true;
    ghost = null;
    ghostLayer = ghostLayerCtx = null;
    ghostLayerUpto = 0;
    ghostShown = 0;
    return true;
  }

  // Both pickers are toggle groups, so exactly one member is pressed at a time.
  // The class draws the ring and aria-pressed says the same thing out loud;
  // setting them from one place is what keeps them from disagreeing.
  function select(group, btn) {
    var all = group.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) {
      var on = all[i] === btn;
      all[i].classList.toggle('active', on);
      all[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  // Build the 5 swatch buttons into the colour group.
  PALETTE.forEach(function (color) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.style.background = color.hex;
    b.setAttribute('aria-label', color.name);
    b.addEventListener('click', function () {
      // Picking the colour that is already picked changes nothing, so it is not
      // input and must not dismiss the opening flourish.
      if (strokeColor === color.hex) return;
      strokeColor = color.hex;
      select(swatchGroup, b);
      if (dismissGhost()) redraw();
    });
    swatchGroup.appendChild(b);
  });
  select(swatchGroup, swatchGroup.children[0]);

  // Pen picker, same active-state ring as the swatches.
  PEN_ORDER.forEach(function (id) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'action pen';
    b.textContent = id;
    b.setAttribute('aria-label', 'pen ' + id);
    b.addEventListener('click', function () {
      if (penId === id) return; // already this pen: nothing happens, nothing is dismissed
      penId = id;
      select(penGroup, b);
      if (dismissGhost()) redraw();
    });
    penGroup.appendChild(b);
  });
  select(penGroup, penGroup.children[PEN_ORDER.indexOf(penId)]);

  // --- Orbit pen physics ---------------------------------------------------
  // The visible pen circles an invisible center; the center chases the
  // pointer with lerp momentum. All tuning constants are expressed per
  // 60fps frame and normalized by dt so the feel is frame-rate independent.
  // The tuning constants themselves live in PENS at the top of the file.
  var FRAME = 1000 / 60;

  var drawing = false;
  // Pointer released, physics still running. The orbit center trails the hand
  // by roughly `speed * (1 - chase) / chase` px — 19 frames of travel for
  // `drift`, which is a third of a desktop canvas at a brisk drag. Freezing the
  // loop on pointerup left all of that lag as ink that never got drawn, so the
  // stroke ended far behind where it was released. Instead the release point
  // becomes the target and the loop keeps integrating toward it, appending to
  // the *same* pending stroke, so undo/redo/replay see one entry with its tail.
  var settling = false;
  var settleMs = 0;
  var SETTLE_EPS = 0.5;   // px: close enough that the remaining lag is invisible
  var SETTLE_MS = 900;    // and a hard cap, so no chase value can spin forever
  var activePointerId = null;
  var pointerX = 0, pointerY = 0;  // last-known pointer position (CSS px)
  var centerX = 0, centerY = 0;    // orbit center (chases pointer)
  var angle = 0;
  var penX = 0, penY = 0;
  var firstFrame = false;          // skip the segment right after pointerdown
  var strokeW = 0;                 // smoothed stroke width
  var lastTime = null;

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // Capture keeps a drag drawing after it leaves the canvas. It is an
  // enhancement, not a requirement — without it the stroke simply stops
  // tracking at the edge — and `setPointerCapture` throws for a pointer id the
  // browser has no live record of. So it is attempted, never depended on: an
  // escaping throw would leave `activePointerId` latched on a pointer that can
  // never send pointerup, and the app would be permanently unable to start
  // another stroke while every button still worked, i.e. broken but alive.
  function tryCapture(id) {
    try { canvas.setPointerCapture(id); } catch (err) { /* no capture; still draws */ }
  }

  // ...and the same latch is reachable without any throw, from a pointer that
  // goes down and is never heard from again. So the claim on `activePointerId`
  // is only honoured while the canvas actually holds that pointer's capture:
  // a fresh pointerdown against a stale claim ends the old gesture and takes
  // over, which makes "unable to draw" a state the app cannot stay in.
  function activePointerIsLive() {
    return activePointerId !== null &&
      (!canvas.hasPointerCapture || canvas.hasPointerCapture(activePointerId));
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return; // primary button only (touch/pen report 0)
    // A primary press on the canvas is a press to draw, so the flourish goes
    // now — redraw() here is the erase, this frame, not a fade. It is *after*
    // the button test on purpose: a right-click opens a context menu and draws
    // nothing, and used to take the flourish with it.
    if (dismissGhost()) redraw();
    if (activePointerIsLive()) return; // first active pointer wins
    // A stale claim, or a tail still settling from the last release, is
    // committed here and the new gesture takes over: settling is interruptible.
    if (activePointerId !== null || settling) {
      activePointerId = null;
      endStroke();
      updateChrome();
    }
    activePointerId = e.pointerId;
    tryCapture(e.pointerId);
    var p = pointerPos(e);
    pointerX = p.x;
    pointerY = p.y;
    // Snap the center to the pointer so a new stroke never teleport-streaks
    // from wherever the last stroke ended.
    centerX = p.x;
    centerY = p.y;
    // The pen is captured here, so switching pens mid-gesture is impossible
    // and a stroke's physics matches the id it is recorded under. A later
    // resize cannot restyle this stroke: the path it emits is what history
    // keeps, so replay is faithful whatever the scale becomes.
    livePen = scaledPen(PENS[penId]);
    penX = centerX + livePen.radius * Math.cos(angle);
    penY = centerY + livePen.radius * Math.sin(angle);
    firstFrame = true;
    strokeW = livePen.wMax; // each stroke tapers from its own start, not the last one's end
    drawing = true;
    pending = { kind: 'stroke', pen: penId, color: strokeColor, pts: [] };
  });

  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activePointerId) return;
    var p = pointerPos(e);
    pointerX = p.x;
    pointerY = p.y;
  });

  function liftPen(e) {
    if (e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    activePointerId = null;
    drawing = false;
    // Nothing to commit if a history action already ended the stroke.
    if (!pending) { settling = false; return; }
    // A release hands the stroke to the settle phase. An interruption
    // (pointercancel, blur) is not a release, and a tap too short to have
    // drawn a segment has no tail to finish — both end flat.
    if (e && e.type === 'pointerup' && pending.pts.length >= 6) {
      var p = pointerPos(e);
      pointerX = p.x;
      pointerY = p.y;
      settling = true;
      settleMs = 0;
      return;
    }
    endStroke();
    updateChrome();
  }
  canvas.addEventListener('pointerup', liftPen);
  canvas.addEventListener('pointercancel', liftPen);
  // An interrupted touch (alt-tab, incoming call) must never leave the pen stuck.
  window.addEventListener('blur', function () { liftPen(); });

  function tick(now) {
    if (lastTime === null) lastTime = now;
    // Clamp dt so a backgrounded tab doesn't produce one giant physics jump.
    var dt = Math.min(now - lastTime, 3 * FRAME);
    lastTime = now;
    var frames = dt / FRAME;

    // The flourish draws itself in at the rate it was recorded — one sample per
    // 60fps frame, ~2.4s — then rests until something dismisses it. Under
    // prefers-reduced-motion it was completed before the first frame, so this
    // block never runs.
    if (ghost && ghostShown < GHOST_FRAMES && ghostActive()) {
      ghostMs += dt;
      var upto = Math.min(GHOST_FRAMES, Math.floor(ghostMs / FRAME));
      if (upto > ghostShown) {
        var firstInk = ghostShown === 0;
        ghostShown = upto;
        composeGhost();
        // composeGhost() is the animation's fast path and deliberately skips
        // updateChrome(); the one thing that does change when the first segment
        // lands is what the canvas is called, so say it then.
        if (firstInk) nameCanvas();
      }
    }

    if (drawing || settling) {
      // Frame-rate-normalized lerp: equivalent to pen.chase per frame at 60fps.
      var alpha = 1 - Math.pow(1 - livePen.chase, frames);
      centerX += (pointerX - centerX) * alpha;
      centerY += (pointerY - centerY) * alpha;
      angle += livePen.angVel * frames;

      var prevX = penX, prevY = penY;
      penX = centerX + livePen.radius * Math.cos(angle);
      penY = centerY + livePen.radius * Math.sin(angle);

      if (firstFrame) {
        firstFrame = false;
        // The anchor sample: no segment yet, but replay needs a start point.
        pending.pts.push(penX, penY, strokeW);
      } else {
        // Speed taper: fast pen = thin line, slow pen = thick. The orbit alone
        // already moves the pen at roughly speedBase, so the map starts there.
        var dist = Math.hypot(penX - prevX, penY - prevY);
        var speed = frames > 0 ? dist / frames : 0; // px per 60fps frame
        var target = livePen.wMax - (speed - livePen.speedBase) * livePen.taper;
        if (target < livePen.wMin) target = livePen.wMin;
        if (target > livePen.wMax) target = livePen.wMax;
        strokeW += (target - strokeW) * 0.3; // smooth so width never pops

        // Record the width the live segment is about to use, so a replayed
        // stroke is pixel-identical to the one that was drawn.
        pending.pts.push(penX, penY, strokeW);

        ctx.strokeStyle = pending.color;
        ctx.lineWidth = strokeW;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(penX, penY);
        ctx.stroke();

        // The stroke has just become real: it hides the hint, and it is
        // already undoable. Fires once per stroke, not once per frame — unless
        // the hint is still up because the loop started off the edge, in which
        // case the first sample that lands on the canvas fires it again.
        if (pending.pts.length === 6 || (hintVisible && onCanvas(penX, penY, strokeW))) {
          updateChrome();
        }
      }
    }

    // The tail is done when the center has caught the release point, or when
    // the cap expires — checked after this frame's integration so the last
    // segment is always recorded.
    if (settling) {
      settleMs += dt;
      if (settleMs >= SETTLE_MS ||
          Math.hypot(pointerX - centerX, pointerY - centerY) <= SETTLE_EPS) {
        endStroke();
        updateChrome();
      }
    }
    requestAnimationFrame(tick);
  }

  // --- Undo / redo ---------------------------------------------------------
  // Buttons and shortcuts are two doors into the same two functions.
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  window.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || !e.key) return;
    var k = e.key.toLowerCase();
    if (k === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    } else if (k === 'y') {
      e.preventDefault();
      redo();
    }
  });

  // --- Clear / Save --------------------------------------------------------
  clearBtn.addEventListener('click', function () {
    // The button is disabled when there is nothing to clear; this also covers
    // a click that beats the next updateChrome. Clearing an already-clear
    // canvas would leave a dead undo step to press through.
    if (!hasInk()) return;
    endStroke(); // a stroke in progress is part of what Clear clears
    pushEntry({ kind: 'clear' });
    redraw();
  });

  // A download is invisible in-page: on a browser that saves silently, Save
  // PNG looked like a button that did nothing. The button says so itself for a
  // moment — no new element, and the width is pinned first so the bar cannot
  // reflow under the pointer. aria-live carries the same word to a screen
  // reader; the label is the only text in the bar that ever changes.
  // The button's *name* is not part of the acknowledgement. It carries a fixed
  // `aria-label`, so whatever the visible label reads, the accessible name
  // stays "Save PNG" and the live region announces the change without the
  // control renaming itself. Before that, a screen-reader user who landed on
  // the button inside the 1.6 s window heard "Saved ✓, button" — a name for an
  // action, not for the thing the button does. `SAVE_LABEL` and the label are
  // set where `saveBtn` is looked up, so both exist before the first redraw.
  var saveAckTimer = null;
  function clearSaveAck() {
    clearTimeout(saveAckTimer);
    saveAckTimer = null;
    if (saveBtn.textContent !== SAVE_LABEL) saveBtn.textContent = SAVE_LABEL;
  }
  function ackSave() {
    if (!saveBtn.style.minWidth) saveBtn.style.minWidth = saveBtn.offsetWidth + 'px';
    saveBtn.textContent = 'Saved ✓';
    clearTimeout(saveAckTimer);
    saveAckTimer = setTimeout(clearSaveAck, 1600);
  }

  saveBtn.addEventListener('click', function () {
    if (!hasInk()) return; // never export a blank rectangle
    canvas.toBlob(function (blob) {
      if (!blob) return; // toBlob may yield null; export is a no-op then, and
                         // an export that did not happen is not acknowledged
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'orbit-doodle.png';
      a.click();
      // Ask the ink question again, here, on the far side of the encode. The
      // guard that drops the ack runs synchronously from updateChrome() while
      // this callback runs whenever toBlob is done — 47.4ms at 1440x900/dpr 2 —
      // so a Clear or a Ctrl+Z in that window disabled the button first and
      // this line landed a bright "Saved ✓" on it afterwards, for the rest of
      // the 1.6s timer. The export itself is unaffected: toBlob snapshots at
      // call time, so the PNG is the drawing that was there when it was asked
      // for. Only the acknowledgement is withheld, because there is no longer a
      // control for it to sit on.
      if (hasInk()) ackSave();
      // Revoking in the same task can beat the download on slower engines,
      // which then saves nothing. One minute is far longer than any browser
      // needs to pick the blob up, and the blob is freed either way.
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    });
  });

  // --- Resize --------------------------------------------------------------
  // Resizing wipes the canvas, and history is the source of truth, so resize
  // is just: re-size, replay. No snapshot to stretch and no second, disagreeing
  // record of the picture. Strokes a narrowed window pushes off-canvas survive
  // in history and reappear when it widens again.
  var resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      sizeCanvas();
      redraw();
    }, 100);
  }
  window.addEventListener('resize', onResize);
  // A dpr change (dragging between screens, browser zoom) does not always fire
  // resize; watch the resolution directly. matchMedia listeners re-arm because
  // the query itself has to be rebuilt around the new dpr.
  (function watchDpr() {
    var mq = window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)');
    function onChange() {
      if (mq.removeEventListener) mq.removeEventListener('change', onChange);
      else if (mq.removeListener) mq.removeListener(onChange);
      onResize();
      watchDpr();
    }
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  })();

  // Using a control is input too — but only a control that does something.
  // This used to be one capture listener on the whole bar that fired for any
  // button, reached any way, which made pressing the already-selected colour
  // (or the already-selected pen) wipe the flourish for no change at all. The
  // dismissal now lives inside the two handlers that can change anything while
  // the flourish is up, on the same branch that makes the change: see the
  // swatch and pen builders above. The other four controls are all disabled on
  // an empty canvas, and Clear and Save PNG return early on `!hasInk()`
  // anyway, so there is no path from them to a live flourish; Undo and Redo
  // return early on an empty history, which is the D8 case they own.

  sizeCanvas();
  // Asked for stillness: the flourish is complete before the first paint and
  // nothing animates. It is the same path, at the same size — only the draw-in
  // is skipped.
  if (reduceMotion.matches) ghostShown = GHOST_FRAMES;
  redraw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
