<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orbit-doodle</title>
<style>
  /* Layout: canvas fills everything above a fixed-height controls bar.
     No page scroll ever — the canvas owns the viewport. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: #111;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #stage {
    position: relative; /* anchor for the hint overlay */
    flex: 1;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none; /* touch drags must draw, not scroll */
    cursor: crosshair;
  }
  /* Hint lives in the DOM (not the canvas) so it never shows up in exports. */
  #hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245, 239, 230, 0.55);
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 0 1rem;
    pointer-events: none; /* never intercept the drawing pointer */
    transition: opacity 0.6s ease;
  }
  #hint.hidden { opacity: 0; }
  /* Controls: one row, pinned to the bottom edge. Every target >= 40px so
     it stays tappable at 375px width. */
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    background: #1b1b1b;
    border-top: 1px solid #2a2a2a;
  }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex: none;
  }
  .swatch.active {
    border-color: #f5efe6;
    box-shadow: 0 0 0 2px #111 inset;
  }
  #controls button.action {
    min-height: 40px;
    min-width: 40px;
    padding: 0 14px;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    background: #242424;
    color: #f5efe6;
    font-size: 0.95rem;
    cursor: pointer;
    flex: none;
  }
  #controls button.action:active { background: #333; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="hint">press and drag — the pen orbits you</div>
</div>
<div id="controls">
  <!-- Swatches injected by JS from the palette so color data lives in one place -->
  <button class="action" id="clear" type="button">Clear</button>
  <button class="action" id="save" type="button">Save PNG</button>
</div>
<script>
(function () {
  'use strict';

  var BG = '#111';
  // warm white, coral, gold, mint, sky blue
  var PALETTE = ['#f5efe6', '#ff6b6b', '#ffc94d', '#6be5b0', '#6bb8ff'];

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var hint = document.getElementById('hint');
  var controls = document.getElementById('controls');
  var ctx = canvas.getContext('2d');

  var strokeColor = PALETTE[0];

  // Size the backing store for devicePixelRatio; keep ctx in CSS-pixel units.
  // Background is painted onto the canvas itself so PNG exports are WYSIWYG.
  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);
  }

  // Build the 5 swatch buttons ahead of Clear/Save.
  PALETTE.forEach(function (color, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = color;
    b.setAttribute('aria-label', 'color ' + (i + 1));
    b.addEventListener('click', function () {
      strokeColor = color;
      var prev = controls.querySelector('.swatch.active');
      if (prev) prev.classList.remove('active');
      b.classList.add('active');
    });
    controls.insertBefore(b, document.getElementById('clear'));
  });

  // --- Orbit pen physics ---------------------------------------------------
  // The visible pen circles an invisible center; the center chases the
  // pointer with lerp momentum. All tuning constants are expressed per
  // 60fps frame and normalized by dt so the feel is frame-rate independent.
  var CHASE = 0.12;        // center lerp factor per 60fps frame
  var ANGULAR_VEL = 0.22;  // pen angle advance, rad per 60fps frame
  var ORBIT_RADIUS = 40;   // px
  var WIDTH_MIN = 1, WIDTH_MAX = 6; // stroke taper clamp, px
  var FRAME = 1000 / 60;

  var drawing = false;
  var activePointerId = null;
  var pointerX = 0, pointerY = 0;  // last-known pointer position (CSS px)
  var centerX = 0, centerY = 0;    // orbit center (chases pointer)
  var angle = 0;
  var penX = 0, penY = 0;
  var firstFrame = false;          // skip the segment right after pointerdown
  var strokeW = WIDTH_MAX;         // smoothed stroke width
  var hintHidden = false;
  var lastTime = null;

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (activePointerId !== null) return; // first active pointer wins
    activePointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    var p = pointerPos(e);
    pointerX = p.x;
    pointerY = p.y;
    // Snap the center to the pointer so a new stroke never teleport-streaks
    // from wherever the last stroke ended.
    centerX = p.x;
    centerY = p.y;
    penX = centerX + ORBIT_RADIUS * Math.cos(angle);
    penY = centerY + ORBIT_RADIUS * Math.sin(angle);
    firstFrame = true;
    drawing = true;
  });

  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activePointerId) return;
    var p = pointerPos(e);
    pointerX = p.x;
    pointerY = p.y;
  });

  function liftPen(e) {
    if (e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    drawing = false;
    activePointerId = null;
  }
  canvas.addEventListener('pointerup', liftPen);
  canvas.addEventListener('pointercancel', liftPen);
  // An interrupted touch (alt-tab, incoming call) must never leave the pen stuck.
  window.addEventListener('blur', function () { liftPen(); });

  function tick(now) {
    if (lastTime === null) lastTime = now;
    // Clamp dt so a backgrounded tab doesn't produce one giant physics jump.
    var dt = Math.min(now - lastTime, 3 * FRAME);
    lastTime = now;
    var frames = dt / FRAME;

    if (drawing) {
      // Frame-rate-normalized lerp: equivalent to CHASE per frame at 60fps.
      var alpha = 1 - Math.pow(1 - CHASE, frames);
      centerX += (pointerX - centerX) * alpha;
      centerY += (pointerY - centerY) * alpha;
      angle += ANGULAR_VEL * frames;

      var prevX = penX, prevY = penY;
      penX = centerX + ORBIT_RADIUS * Math.cos(angle);
      penY = centerY + ORBIT_RADIUS * Math.sin(angle);

      if (firstFrame) {
        firstFrame = false;
      } else {
        // Speed taper: fast pen = thin line, slow pen = thick. The orbit
        // alone moves the pen ~9px/frame, so the map starts near that floor.
        var dist = Math.hypot(penX - prevX, penY - prevY);
        var speed = frames > 0 ? dist / frames : 0; // px per 60fps frame
        var target = WIDTH_MAX - (speed - 8) * 0.18;
        if (target < WIDTH_MIN) target = WIDTH_MIN;
        if (target > WIDTH_MAX) target = WIDTH_MAX;
        strokeW += (target - strokeW) * 0.3; // smooth so width never pops

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = strokeW;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(penX, penY);
        ctx.stroke();

        if (!hintHidden) {
          hintHidden = true;
          hint.classList.add('hidden');
        }
      }
    }
    requestAnimationFrame(tick);
  }

  // --- Clear / Save --------------------------------------------------------
  document.getElementById('clear').addEventListener('click', function () {
    // No confirmation, no history: repaint the background and move on.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, stage.clientWidth, stage.clientHeight);
  });

  document.getElementById('save').addEventListener('click', function () {
    canvas.toBlob(function (blob) {
      if (!blob) return; // toBlob may yield null; export is a no-op then
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'orbit-doodle.png';
      a.click();
      URL.revokeObjectURL(url);
    });
  });

  // --- Resize survival -----------------------------------------------------
  // Resizing a canvas wipes it, so: snapshot to an offscreen canvas, resize,
  // repaint the background, then draw the snapshot back at top-left. The
  // snapshot is copied at its original CSS size (old dpr divided out) so
  // artwork keeps its scale across dpr changes (e.g. dragging between screens).
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (canvas.width === 0 || canvas.height === 0) { sizeCanvas(); return; }
      var oldDpr = ctx.getTransform().a || 1;
      var snap = document.createElement('canvas');
      snap.width = canvas.width;
      snap.height = canvas.height;
      snap.getContext('2d').drawImage(canvas, 0, 0);
      sizeCanvas();
      ctx.drawImage(snap, 0, 0, snap.width / oldDpr, snap.height / oldDpr);
    }, 100);
  });

  sizeCanvas();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
